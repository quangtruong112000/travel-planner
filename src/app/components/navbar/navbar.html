<header class="navbar">
  <div class="container nav-container">
    <a href="#" class="brand">
      <span class="logo-icon">🗺️</span>
      <span class="brand-text">TRAVEL<span class="highlight">PLAN</span></span>
    </a>

    <nav class="nav-links">
      @for (item of navItems; track item.href) {
        <a (click)="onNavClick(item.href)" class="cursor-pointer">{{ item.label }}</a>
      }
    </nav>

    <div class="nav-actions">
      <button class="theme-toggle" (click)="toggleDarkMode.emit()" aria-label="Toggle dark mode">
        @if (isDarkMode) {
          ☀️
        } @else {
          🌙
        }
      </button>

      <button
        class="mobile-toggle"
        (click)="toggleMenu()"
        aria-label="Toggle menu"
        [class.open]="mobileMenuOpen"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="mobile-navbar" [class.open-nav-links]="mobileMenuOpen">
        <div class="nav-links-mobile">
          @for (item of navItems; track item.href) {
            <a (click)="onNavClick(item.href)" class="cursor-pointer mobile-link">{{
              item.label
            }}</a>
          }
        </div>
      </div>
    </div>
  </div>
</header>
